<circle cx="360" cy="368" r="4" fill="#8b949e"/>
<text x="374" y="372" font-size="12.5" fill="#c9d1d9">Index foreign keys in hot joins</text>
<circle cx="360" cy="390" r="4" fill="#8b949e"/>
<text x="374" y="394" font-size="12.5" fill="#c9d1d9">Type api responses with zod infer</text>
