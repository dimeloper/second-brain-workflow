<text x="694" y="350" font-size="12.5" fill="#c9d1d9">Bound every call with a timeout</text>
<circle cx="680" cy="368" r="4" fill="#3fb950"/>
<text x="694" y="372" font-size="12.5" fill="#c9d1d9">Never trust client role checks</text>
<circle cx="680" cy="390" r="4" fill="#3fb950"/>
<text x="694" y="394" font-size="12.5" fill="#c9d1d9">Paginate list endpoints by default</text>
