name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # vendor/obsidian-skills is a pinned submodule

      # Pinned, not apt's. Ubuntu's package is older than a developer's brew
      # install, and the two disagree about which checks fire — v0.23.0 and
      # v0.24.0 both shipped with a failing lint because `make check` was green
      # locally and nobody opened the run. A lint whose verdict depends on which
      # machine ran it is not a gate.
      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJf - --strip-components=1 -C /usr/local/bin "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          shellcheck --version | sed -n 2p

      - name: Show versions
        run: |
          bash --version | head -1
          python3 --version
          shellcheck --version | sed -n 2p

      - name: make check
        run: make check

  # macOS ships bash 3.2, and the work machine may not allow a newer one, so
  # the scripts must keep running there. Ubuntu's bash 5 would hide a
  # 3.2 incompatibility such as an associative array or `readarray`.
  bash32:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Run tests under /bin/bash (3.2)
        run: |
          /bin/bash --version | head -1
          fail=0
          for t in tests/test-*.sh; do /bin/bash "$t" || fail=1; done
          exit $fail
